version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      prefix: "chore"
      word-separator: "-"
      branch-name-case: "lowercase"

updates:
  - package-ecosystem: uv
    directory: /etl
    multi-ecosystem-group: infrastructure
    patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /web
    multi-ecosystem-group: infrastructure
    patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: infrastructure
    patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
