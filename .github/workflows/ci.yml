name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  etl:
    name: etl (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          sudo ln -sf /usr/lib/postgresql/*/bin/pg_ctl /usr/bin/pg_ctl

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type-check
        run: uv run ty check

      - name: Test
        run: uv run pytest --cov

  web:
    name: web (sveltekit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
