name: ETL reload

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this reload is running (shows up in the run log)
        required: false
        default: ""
      skip_sanity_gate:
        description: Swap even if term/edge counts moved more than 10%
        type: boolean
        default: false

jobs:
  reload:
    name: parse, normalize, load into Neon
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Wiktionary adds language codes between dumps, and filter,
      # normalize, and load all resolve codes through this snapshot.
      # Not committed back: the next manual sync-languages does that.
      - name: Refresh the language registry
        run: uv run etymyriad sync-languages

      # kaikki.org serves only its latest dump, at an undated URL, and
      # states the date on its download page. Read it before and after
      # downloading, so a dump swapped mid-download fails the run.
      - name: Read the served dump date
        id: dump
        run: |
          served=$(curl -fsSL https://kaikki.org/dictionary/rawdata.html \
            | grep -oP 'enwiktionary dump dated \K\d{4}-\d{2}-\d{2}' | head -1)
          if [ -z "$served" ]; then
            echo "could not read the dump date from kaikki.org" >&2
            exit 1
          fi
          echo "date=$served" >> "$GITHUB_OUTPUT"

      - name: Cache raw Wiktextract dump
        id: raw-cache
        uses: actions/cache@v4
        with:
          path: data/raw-wiktextract-data.jsonl.gz
          key: raw-wiktextract-dump-${{ steps.dump.outputs.date }}

      - name: Download raw Wiktextract dump
        if: steps.raw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --create-dirs -o ../data/raw-wiktextract-data.jsonl.gz \
            https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz
          after=$(curl -fsSL https://kaikki.org/dictionary/rawdata.html \
            | grep -oP 'enwiktionary dump dated \K\d{4}-\d{2}-\d{2}' | head -1)
          if [ "$after" != "${{ steps.dump.outputs.date }}" ]; then
            echo "kaikki.org moved from ${{ steps.dump.outputs.date }}" \
              "to ${after:-unknown} during the download" >&2
            exit 1
          fi

      # Not cached: the filtered file depends on the filter code and the
      # language registry as well as the dump, so a cache key would have
      # to hash all three. Re-filtering the cached raw dump is simpler.
      - name: Filter to the languages and fields in scope
        run: >
          uv run etymyriad filter
          --input ../data/raw-wiktextract-data.jsonl.gz

      # The three artifacts this job writes (2.8GB raw dump, 14.5GB
      # filtered dump, ~3GB edge file) come to ~20GB, close enough to a
      # hosted runner's free workspace space that running out is a
      # plausible failure mode. `if: always()` so the reading survives
      # the step that ran out, which is when it's worth having.
      - name: Disk after filter
        if: always()
        run: df -h .

      - name: Normalize
        run: uv run etymyriad normalize --edges data/edges.jsonl

      - name: Disk after normalize
        if: always()
        run: df -h .

      - name: Load into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WIKTEXTRACT_DUMP_DATE: ${{ steps.dump.outputs.date }}
        run: >
          uv run etymyriad load --edges data/edges.jsonl
          ${{ inputs.skip_sanity_gate && '--skip-sanity-gate' || '' }}
