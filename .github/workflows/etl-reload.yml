name: ETL reload

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this reload is running (shows up in the run log)
        required: false
        default: ""

jobs:
  reload:
    name: parse, normalize, load into Neon
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Bump this cache key by hand whenever WIKTEXTRACT_DUMP_DATE in
      # config.py is bumped, mirroring that file's own bump-by-hand
      # convention -- otherwise a refreshed dump keeps hitting the
      # stale cached copy of the old one.
      - name: Cache raw Wiktextract dump
        id: raw-cache
        uses: actions/cache@v4
        with:
          path: etl/raw-wiktextract-data.jsonl.gz
          key: raw-wiktextract-dump-2026-06-01

      - name: Download raw Wiktextract dump
        if: steps.raw-cache.outputs.cache-hit != 'true'
        run: >
          curl -fL -o raw-wiktextract-data.jsonl.gz
          https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz

      # Not cached: the filtered output is ~14GB, past the Actions
      # cache's flat 10GB-per-repo quota (evicts everything else on
      # save, or fails outright), which is cheaper to re-filter the
      # cached raw dump above every run than to fight that quota.
      - name: Filter to Indo-European
        run: >
          uv run etymyriad filter-ine --input raw-wiktextract-data.jsonl.gz
          --output ../data/raw/indo-european.jsonl

      # The three artifacts this job writes (2.8GB raw dump, 14.5GB
      # filtered dump, ~3GB edge file) come to ~20GB, close enough to a
      # hosted runner's free workspace space that running out is a
      # plausible failure mode. `if: always()` so the reading survives
      # the step that ran out, which is when it's worth having.
      - name: Disk after filter
        if: always()
        run: df -h .

      - name: Normalize
        run: uv run etymyriad normalize --edges data/edges.jsonl

      - name: Disk after normalize
        if: always()
        run: df -h .

      - name: Load into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run etymyriad load --edges data/edges.jsonl
