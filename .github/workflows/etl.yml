name: ETL

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this reload is running (shows up in the run log)
        required: false
        default: ""
      skip_sanity_gate:
        description: Swap even if term/edge counts moved more than 10%
        type: boolean
        default: false

jobs:
  reload:
    name: parse, normalize, load into Neon
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Wiktionary adds language codes between dumps, and filter,
      # normalize, and load all resolve codes through this snapshot.
      # Not committed back: the next manual sync-languages does that.
      - name: Refresh the language registry
        run: uv run etymyriad sync-languages

      # No exact key is known before the fetch, so restore the newest
      # cached dump by prefix. fetch-dump downloads a newer one only if
      # kaikki.org serves one, and fails if the dump changes mid-download.
      - name: Restore cached raw Wiktextract dump
        id: raw-cache
        uses: actions/cache/restore@v4
        with:
          path: data/wiktextract-data-*.jsonl.gz
          key: wiktextract-dump-none
          restore-keys: wiktextract-dump-

      - name: Fetch the raw Wiktextract dump
        id: fetch
        run: |
          path=$(uv run etymyriad fetch-dump)
          name=$(basename "$path")
          date=${name#wiktextract-data-}
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "date=${date%.jsonl.gz}" >> "$GITHUB_OUTPUT"

      - name: Cache raw Wiktextract dump
        if: >
          steps.raw-cache.outputs.cache-matched-key !=
          format('wiktextract-dump-{0}', steps.fetch.outputs.date)
        uses: actions/cache/save@v4
        with:
          path: data/wiktextract-data-*.jsonl.gz
          key: wiktextract-dump-${{ steps.fetch.outputs.date }}

      # Not cached: the filtered file depends on the filter code and the
      # language registry as well as the dump, so a cache key would have
      # to hash all three. Re-filtering the cached raw dump is simpler.
      - name: Filter to the languages and fields in scope
        run: >
          uv run etymyriad filter
          --input ${{ steps.fetch.outputs.path }}

      # The three artifacts this job writes (3.0GB raw dump, 2.4GB
      # filtered dump, 3.2GB edge file) come to ~8.6GB, well inside a
      # hosted runner's free workspace space. The readings stay as a
      # cheap warning if the dump grows. `if: always()` so the reading
      # survives the step that ran out, which is when it's worth having.
      - name: Disk after filter
        if: always()
        run: df -h .

      - name: Normalize
        run: uv run etymyriad normalize

      - name: Disk after normalize
        if: always()
        run: df -h .

      - name: Load into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          uv run etymyriad load
          ${{ inputs.skip_sanity_gate && '--skip-sanity-gate' || '' }}
