# Local Postgres for development. Run with `podman compose up -d`
# (or `docker compose up -d`). See the Makefile for convenience targets.
#
# This mirrors what CockroachDB Cloud runs in production so the schema and
# queries behave identically. Never used in production.

services:
  db:
    image: docker.io/library/postgres:17
    container_name: etymyriad-db
    environment:
      POSTGRES_USER: etymyriad
      POSTGRES_PASSWORD: etymyriad
      POSTGRES_DB: etymyriad
    ports:
      - "5432:5432"
    volumes:
      - etymyriad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etymyriad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  etymyriad-pgdata:
