[project]
name = "etymyriad"
version = "0.2.0"
description = "Parse Wiktextract data into a normalized etymology graph and load it into Postgres."
authors = [ { name = "Finn van Riper" } ]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]~=3.2",
    "httpx~=0.28",
    "python-igraph>=1.0.0",
]

[project.scripts]
etymyriad = "etymyriad.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etymyriad"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-postgresql>=8",
    "ty>=0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",  # show all test summary info
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
extend = "ruff.pythonicator.toml"

[tool.ruff.lint]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
# Tests may assert freely, reach private members, and
# hardcode throwaway credentials for the local test database.
"tests/**/*.py" = ["S101", "SLF001", "S106", "PLC2701"]
# The CLI entry point writes results to stdout; print is intentional here.
"src/etymyriad/__main__.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["etymyriad"]
required-imports = ["from __future__ import annotations"]
