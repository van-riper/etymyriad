[project]
name = "etymyriad"
version = "0.1.4"
description = "Parse Wiktextract data into a normalized etymology graph and load it into Postgres."
authors = [ { name = "Finn van Riper" } ]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]~=3.2",
    "httpx~=0.28",
]

[project.scripts]
etymyriad = "etymyriad.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etymyriad"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-postgresql>=8",
    "ty>=0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",  # show all test summary info
    "--strict-config",
    "--strict-markers",
    "--cov",
    "--cov-report=term-missing",
    "--import-mode=importlib",
    "--tb=short",
]

[tool.ruff]
extend = "ruff.toml"
