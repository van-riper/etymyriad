[project]
name = "etymyriad"
version = "0.4.12"
description = "Parse Wiktextract data into a normalized etymology graph and load it into Postgres."
authors = [ { name = "Finn van Riper" } ]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "httpx~=0.28",
    "psycopg[binary]~=3.2",
    "pydantic~=2.13",
]

[project.scripts]
etymyriad = "etymyriad.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etymyriad"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-postgresql>=8",
    "ty>=0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",  # show all test summary info
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
extend = "ruff.pythonicator.toml"

[tool.ruff.lint]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "assert",
    "hardcoded-password-func-arg",
    "hardcoded-sql-expression",
    "implicit-namespace-package",
    "import-private-name",
    "private-member-access",
]
"src/etymyriad/__main__.py" = ["T20"] # The CLI module needs print statements.
"src/etymyriad/normalize/_normalize.py" = [
    # pickle spools our own objects to a private tempfile within one
    # process, never untrusted input.
    "suspicious-pickle-import",
    "suspicious-pickle-usage",
    # _InflectionSpool's tempfile outlives its opening function, closed
    # only once its owner's replay() is exhausted, since a single `with`
    # can't express that lifetime.
    "open-file-with-context-handler",
]

[tool.ruff.lint.isort]
known-first-party = ["etymyriad"]
required-imports = ["from __future__ import annotations"]
