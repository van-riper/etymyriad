<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:wght@700&family=Noto+Sans+Gothic&family=Noto+Sans+Cuneiform&family=Noto+Sans+Old+Persian&family=Noto+Sans+Old+Italic&family=Noto+Sans+Brahmi&family=Noto+Sans+Kharoshthi&family=Noto+Sans+Sharada&family=Noto+Sans+Egyptian+Hieroglyphs&family=Noto+Sans+Avestan&family=Noto+Sans+Imperial+Aramaic&family=Noto+Sans+Phoenician&display=swap"
    />
    <script nonce="%sveltekit.nonce%">
      (function () {
        var stored = localStorage.getItem('etymyriad-theme');
        var mode =
          stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored
            : 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
